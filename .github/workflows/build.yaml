name: Build Nouz (CI)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  Windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install .NET MAUI
        run: dotnet workload install maui-desktop
      - name: Build
        run: dotnet build Nouz/src/Nouz/Nouz.csproj -c Release -f:net10.0-windows10.0.19041.0 -p:RuntimeIdentifierOverride=win10-x64
      - name: Unit Tests
        run: dotnet test Nouz/Nouz.slnx -c Release --logger "trx;LogFileName=test-results.trx" || true
      - name: Upload test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: ./**/*.trx
          reporter: dotnet-trx
          fail-on-error: true